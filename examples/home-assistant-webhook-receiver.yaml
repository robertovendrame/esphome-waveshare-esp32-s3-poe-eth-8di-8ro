alias: Alarm Collector - Ricezione webhook
description: Riceve gli eventi dal firmware sperimentale Alarm Contact Collector
triggers:
  - trigger: webhook
    webhook_id: SOSTITUISCI_CON_UN_ID_LUNGO_E_CASUALE
    allowed_methods:
      - POST
    local_only: false
actions:
  - action: logbook.log
    data:
      name: Alarm Contact Collector
      message: >-
        {{ trigger.json.event }}: {{ trigger.json.message }}
  - event: alarm_contact_collector_event
    event_data:
      device: "{{ trigger.json.device }}"
      event: "{{ trigger.json.event }}"
      message: "{{ trigger.json.message }}"
      timestamp: "{{ trigger.json.timestamp }}"
      alarm_1: "{{ trigger.json.alarm_1 }}"
      alarm_2: "{{ trigger.json.alarm_2 }}"
      memory_1: "{{ trigger.json.memory_1 }}"
      memory_2: "{{ trigger.json.memory_2 }}"
      local_ip: "{{ trigger.json.local_ip }}"
      public_ip: "{{ trigger.json.public_ip }}"
      internet_available: "{{ trigger.json.internet_available }}"
      home_assistant_connected: "{{ trigger.json.home_assistant_connected }}"
      uptime_seconds: "{{ trigger.json.uptime_seconds }}"
      temperature_c: "{{ trigger.json.temperature_c }}"
      last_ntp_sync: "{{ trigger.json.last_ntp_sync }}"
      firmware_version: "{{ trigger.json.firmware_version }}"
mode: queued
max: 20
