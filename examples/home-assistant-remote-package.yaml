# Copiare questo file nella cartella packages di Home Assistant e includerlo
# dalla configurazione principale. Definire alarm_collector_webhook_id nei
# secrets di questa istanza Home Assistant. Definire anche
# alarm_collector_payload_token con lo stesso token configurato nel firmware.

input_datetime:
  alarm_collector_last_seen:
    name: Alarm Collector - Ultimo contatto
    has_date: true
    has_time: true

input_text:
  alarm_collector_last_event:
    name: Alarm Collector - Ultimo evento
    max: 255

automation:
  - alias: Alarm Collector - Ricezione webhook
    id: alarm_collector_webhook_receiver
    triggers:
      - trigger: webhook
        webhook_id: !secret alarm_collector_webhook_id
        allowed_methods:
          - POST
        local_only: false
    actions:
      - variables:
          expected_token: !secret alarm_collector_payload_token
      - condition: template
        value_template: >-
          {{ trigger.json.auth_token | default('') == expected_token }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.alarm_collector_last_seen
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.alarm_collector_last_event
        data:
          value: >-
            {{ trigger.json.event }}: {{ trigger.json.message }}
      - if:
          - condition: template
            value_template: "{{ trigger.json.event != 'heartbeat' }}"
        then:
          - action: logbook.log
            data:
              name: Alarm Contact Collector
              message: >-
                {{ trigger.json.event }}: {{ trigger.json.message }}
      - event: alarm_contact_collector_event
        event_data:
          device: "{{ trigger.json.device }}"
          event: "{{ trigger.json.event }}"
          message: "{{ trigger.json.message }}"
          timestamp: "{{ trigger.json.timestamp }}"
          alarm_1: "{{ trigger.json.alarm_1 }}"
          alarm_2: "{{ trigger.json.alarm_2 }}"
          memory_1: "{{ trigger.json.memory_1 }}"
          memory_2: "{{ trigger.json.memory_2 }}"
          local_ip: "{{ trigger.json.local_ip }}"
          public_ip: "{{ trigger.json.public_ip }}"
          internet_available: "{{ trigger.json.internet_available }}"
          home_assistant_connected: "{{ trigger.json.home_assistant_connected }}"
          uptime_seconds: "{{ trigger.json.uptime_seconds }}"
          temperature_c: "{{ trigger.json.temperature_c }}"
          last_ntp_sync: "{{ trigger.json.last_ntp_sync }}"
          firmware_version: "{{ trigger.json.firmware_version }}"
    mode: queued
    max: 20

template:
  - triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
    binary_sensor:
      - name: Alarm Collector collegato
        unique_id: alarm_collector_remote_connected
        device_class: connectivity
        state: >-
          {% set seen = states('input_datetime.alarm_collector_last_seen') %}
          {{ seen not in ['unknown', 'unavailable', ''] and
             (as_timestamp(now()) - as_timestamp(seen)) < 900 }}
        availability: >-
          {{ states('input_datetime.alarm_collector_last_seen') not in
             ['unknown', 'unavailable', ''] }}
