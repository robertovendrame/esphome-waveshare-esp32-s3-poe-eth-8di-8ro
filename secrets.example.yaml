# Chiave fittizia valida per GitHub Actions: generarne una personale in uso reale.
api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
ota_password: "CAMBIA-QUESTA-PASSWORD"

# Telegram: creare il bot con @BotFather.
# telegram_send_url deve contenere il token completo e non va mai pubblicato.
telegram_send_url: "https://api.telegram.org/botINSERISCI_TOKEN/sendMessage"
# Stesso token del bot, endpoint separato per ricevere i comandi.
telegram_updates_url: "https://api.telegram.org/botINSERISCI_TOKEN/getUpdates"
telegram_chat_id: "INSERISCI_CHAT_ID"
# Chat privata o gruppo abilitati a inviare comandi. Gli ID dei gruppi iniziano
# normalmente con -100. Solo telegram_admin_user_id può usare comandi operativi.
telegram_authorized_group_id: "-100INSERISCI_ID_GRUPPO"
telegram_admin_user_id: "INSERISCI_ID_UTENTE_AMMINISTRATORE"

# Home Assistant remoti: usare webhook_id lunghi e casuali.
ha_remote_1_webhook_url: "https://ha-remoto-1.example.com/api/webhook/INSERISCI_WEBHOOK_ID_1"
ha_remote_2_webhook_url: "https://ha-remoto-2.example.com/api/webhook/INSERISCI_WEBHOOK_ID_2"
# Token aggiuntivi inclusi nel JSON e verificati dalle automazioni riceventi.
# Usare valori lunghi, casuali e diversi dal webhook_id.
ha_remote_1_webhook_token: "INSERISCI_TOKEN_PAYLOAD_CASUALE_1"
ha_remote_2_webhook_token: "INSERISCI_TOKEN_PAYLOAD_CASUALE_2"

# Brevo: usare una chiave API (non la chiave SMTP) e un mittente verificato.
brevo_api_key: "xkeysib-INSERISCI_LA_CHIAVE_API"
brevo_sender_email: "allarmi@example.com"
brevo_sender_name: "Alarm Contact Collector"
brevo_recipient_email: "destinatario@example.com"
brevo_recipient_name: "Roberto"
