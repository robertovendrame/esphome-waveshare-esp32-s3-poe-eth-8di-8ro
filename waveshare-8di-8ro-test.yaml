substitutions:
  device_name: waveshare-8di-8ro-test
  friendly_name: "Waveshare 8DI 8RO Test"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  compile_process_limit: 1
  project:
    name: "roberto.waveshare-esp32-s3-8di-8ro"
    version: "0.1.2"
  on_boot:
    priority: -100
    then:
      - switch.turn_off: relay_1
      - switch.turn_off: relay_2
      - switch.turn_off: relay_3
      - switch.turn_off: relay_4
      - switch.turn_off: relay_5
      - switch.turn_off: relay_6
      - switch.turn_off: relay_7
      - switch.turn_off: relay_8
      - pcf85063.read_time:
      - light.turn_on:
          id: status_rgb
          brightness: 35%
          red: 0%
          green: 0%
          blue: 100%
      - delay: 500ms
      - light.turn_off: status_rgb

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  logs:
    component: WARN

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  boot_is_good_after: 1min
  num_attempts: 5

web_server:
  port: 80
  version: 3
  local: true
  log: false

ethernet:
  id: eth
  type: W5500
  clk_pin: GPIO15
  mosi_pin: GPIO13
  miso_pin: GPIO14
  cs_pin: GPIO16
  interrupt_pin: GPIO12
  clock_speed: 26.67MHz
  on_connect:
    then:
      - light.turn_on:
          id: status_rgb
          brightness: 25%
          red: 0%
          green: 100%
          blue: 0%
      - delay: 750ms
      - light.turn_off: status_rgb
  on_disconnect:
    then:
      - light.turn_on:
          id: status_rgb
          brightness: 25%
          red: 100%
          green: 25%
          blue: 0%
      - delay: 750ms
      - light.turn_off: status_rgb

bluetooth_proxy:
  active: true

esp32_ble_tracker:
  scan_parameters:
    active: true

i2c:
  id: main_i2c
  sda: GPIO42
  scl: GPIO41
  scan: true
  frequency: 100kHz

pca9554:
  - id: relay_expander
    address: 0x20
    pin_count: 8

time:
  - platform: pcf85063
    id: board_rtc
    i2c_id: main_i2c
    address: 0x51
    update_interval: never
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Rome
    on_time_sync:
      then:
        - pcf85063.write_time:
            id: board_rtc

uart:
  id: rs485_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512
  debug:
    direction: BOTH
    dummy_receiver: true
    after:
      timeout: 100ms
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');

output:
  - platform: ledc
    id: buzzer_output
    pin: GPIO46
    frequency: 2000Hz

rtttl:
  id: board_buzzer
  output: buzzer_output

light:
  - platform: esp32_rmt_led_strip
    id: status_rgb
    name: "LED RGB"
    pin: GPIO38
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
      - strobe:
      - random:

switch:
  - platform: gpio
    id: relay_1
    name: "Relè 1"
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 0, mode: {output: true}}
  - platform: gpio
    id: relay_2
    name: "Relè 2"
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 1, mode: {output: true}}
  - platform: gpio
    id: relay_3
    name: "Relè 3"
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 2, mode: {output: true}}
  - platform: gpio
    id: relay_4
    name: "Relè 4"
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 3, mode: {output: true}}
  - platform: gpio
    id: relay_5
    name: "Relè 5"
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 4, mode: {output: true}}
  - platform: gpio
    id: relay_6
    name: "Relè 6"
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 5, mode: {output: true}}
  - platform: gpio
    id: relay_7
    name: "Relè 7"
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 6, mode: {output: true}}
  - platform: gpio
    id: relay_8
    name: "Relè 8"
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 7, mode: {output: true}}

binary_sensor:
  - platform: gpio
    id: input_1
    name: "Ingresso 1"
    pin: {number: GPIO4, mode: {input: true, pullup: true}, inverted: true}
    filters: &input_filters [{delayed_on: 20ms}, {delayed_off: 20ms}]
  - platform: gpio
    id: input_2
    name: "Ingresso 2"
    pin: {number: GPIO5, mode: {input: true, pullup: true}, inverted: true}
    filters: *input_filters
  - platform: gpio
    id: input_3
    name: "Ingresso 3"
    pin: {number: GPIO6, mode: {input: true, pullup: true}, inverted: true}
    filters: *input_filters
  - platform: gpio
    id: input_4
    name: "Ingresso 4"
    pin: {number: GPIO7, mode: {input: true, pullup: true}, inverted: true}
    filters: *input_filters
  - platform: gpio
    id: input_5
    name: "Ingresso 5"
    pin: {number: GPIO8, mode: {input: true, pullup: true}, inverted: true}
    filters: *input_filters
  - platform: gpio
    id: input_6
    name: "Ingresso 6"
    pin: {number: GPIO9, mode: {input: true, pullup: true}, inverted: true}
    filters: *input_filters
  - platform: gpio
    id: input_7
    name: "Ingresso 7"
    pin: {number: GPIO10, mode: {input: true, pullup: true}, inverted: true}
    filters: *input_filters
  - platform: gpio
    id: input_8
    name: "Ingresso 8"
    pin: {number: GPIO11, mode: {input: true, pullup: true}, inverted: true}
    filters: *input_filters
  - platform: gpio
    id: boot_button
    name: "Pulsante BOOT"
    entity_category: diagnostic
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms

button:
  - platform: template
    name: "Test relè sequenziale"
    icon: mdi:format-list-numbered
    on_press:
      - script.execute: relay_chase
  - platform: template
    name: "Test buzzer"
    icon: mdi:volume-high
    on_press:
      - rtttl.play: "test:d=16,o=5,b=140:c6,e6,g6"
  - platform: template
    name: "Test LED RGB"
    icon: mdi:led-on
    on_press:
      - script.execute: rgb_test
  - platform: template
    name: "Invia test RS485"
    icon: mdi:serial-port
    on_press:
      - uart.write:
          id: rs485_uart
          data: [0x01, 0x03, 0x00, 0x00, 0x00, 0x01, 0x84, 0x0A]
  - platform: restart
    name: "Riavvia dispositivo"
    entity_category: diagnostic
  - platform: safe_mode
    name: "Riavvia in modalità sicura"
    entity_category: diagnostic

sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 30s
  - platform: internal_temperature
    name: "Temperatura ESP32"
    entity_category: diagnostic
    update_interval: 30s

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "Indirizzo IP Ethernet"
      entity_category: diagnostic
    mac_address:
      name: "MAC Ethernet"
      entity_category: diagnostic

  - platform: version
    name: "Versione ESPHome"
    entity_category: diagnostic
