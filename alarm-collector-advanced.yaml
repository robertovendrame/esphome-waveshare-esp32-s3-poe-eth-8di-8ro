substitutions:
  device_name: alarm-contact-collector
  friendly_name: "Alarm Contact Collector"
  central_1_name: "Centrale 1"
  central_2_name: "Centrale 2"
  brevo_sender_email: !secret brevo_sender_email
  brevo_sender_name: !secret brevo_sender_name
  brevo_recipient_email: !secret brevo_recipient_email
  brevo_recipient_name: !secret brevo_recipient_name
  telegram_updates_url: !secret telegram_updates_url
  telegram_authorized_chat_id: !secret telegram_chat_id

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.0
  compile_process_limit: 1
  project:
    name: "roberto.alarm-contact-collector"
    version: "0.8.2"
  on_boot:
    priority: -100
    then:
      - switch.turn_off: relay_1_internal
      - switch.turn_off: relay_2_internal
      - switch.turn_off: relay_3_internal
      - switch.turn_off: relay_4_internal
      - switch.turn_off: relay_5_internal
      - switch.turn_off: relay_6_internal
      - switch.turn_off: relay_7_internal
      - switch.turn_off: relay_8_internal
      - pcf85063.read_time:
      - lambda: |-
          auto now = id(board_rtc).now();
          id(boot_count) += 1;
          id(boot_event_name) = id(boot_count) == 1 ? "Primo avvio" : "Riavvio";
          if (now.is_valid() && id(last_online_checkpoint) > 0 &&
              now.timestamp >= id(last_online_checkpoint)) {
            id(boot_offline_seconds) = now.timestamp - id(last_online_checkpoint);
          } else {
            id(boot_offline_seconds) = -1;
          }
      - lambda: id(event_log).log_boot();
      - text_sensor.template.publish:
          id: telegram_status
          state: "Nessun invio"
      - text_sensor.template.publish:
          id: brevo_status
          state: "Nessun invio"
      - script.execute: update_status_led
      - delay: 5s
      - lambda: id(startup_complete) = true;
  on_shutdown:
    then:
      - lambda: |-
          auto now = id(board_rtc).now();
          if (now.is_valid()) id(last_online_checkpoint) = now.timestamp;

external_components:
  - source: github://robertovendrame/esphome-waveshare-esp32-s3-poe-eth-8di-8ro@experimental
    components: [event_history]
    refresh: 0s

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB
  partitions:
    - name: event_log
      type: data
      subtype: nvs
      size: 0x20000
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:
  id: native_api
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  boot_is_good_after: 1min
  num_attempts: 5

web_server:
  port: 80
  version: 3
  local: true
  log: false

event_history:
  id: event_log
  time_id: board_rtc
  max_events: 500
  partition: event_log

ethernet:
  id: eth
  type: W5500
  clk_pin: GPIO15
  mosi_pin: GPIO13
  miso_pin: GPIO14
  cs_pin: GPIO16
  interrupt_pin: GPIO12
  clock_speed: 26.67MHz
  on_connect:
    then:
      - script.execute: update_status_led
      - if:
          condition:
            lambda: return !id(ethernet_ever_connected);
          then:
            - lambda: id(ethernet_ever_connected) = true;
            - lambda: id(event_log).log_event("RETE", "Ethernet collegata");
            - delay: 2s
            - script.execute:
                id: network_report
                event_name: !lambda return id(boot_event_name);
                intro: !lambda |-
                  return id(boot_event_name) + std::string(" - causa: ") +
                         id(event_log).reset_reason_text();
                offline_seconds: !lambda return static_cast<int>(id(boot_offline_seconds));
            - lambda: |-
                auto now = id(board_rtc).now();
                if (now.is_valid()) id(last_online_checkpoint) = now.timestamp;
          else:
            - if:
                condition:
                  lambda: return id(ethernet_lost);
                then:
                  - lambda: |-
                      auto now = id(board_rtc).now();
                      if (now.is_valid() && id(ethernet_outage_started) > 0 &&
                          now.timestamp >= id(ethernet_outage_started)) {
                        id(last_outage_seconds) = now.timestamp - id(ethernet_outage_started);
                      } else {
                        id(last_outage_seconds) = -1;
                      }
                      id(ethernet_lost) = false;
                  - lambda: id(event_log).log_event("RETE", "Connessione Ethernet ripristinata");
                  - script.execute:
                      id: network_report
                      event_name: "Ethernet ripristinata"
                      intro: "Connessione Ethernet ripristinata"
                      offline_seconds: !lambda return static_cast<int>(id(last_outage_seconds));
                  - lambda: |-
                      auto now = id(board_rtc).now();
                      if (now.is_valid()) id(last_online_checkpoint) = now.timestamp;
  on_disconnect:
    then:
      - if:
          condition:
            lambda: return id(ethernet_ever_connected);
          then:
            - lambda: |-
                id(ethernet_lost) = true;
                auto now = id(board_rtc).now();
                id(ethernet_outage_started) = now.is_valid() ? now.timestamp : 0;
      - script.execute: update_status_led
      - delay: 10s
      - if:
          condition:
            lambda: return id(ethernet_lost);
          then:
            - lambda: id(event_log).log_event("RETE", "Ethernet assente da almeno 10 secondi");

http_request:
  id: notification_http
  timeout: 10s
  verify_ssl: true
  follow_redirects: true

json:

i2c:
  id: main_i2c
  sda: GPIO42
  scl: GPIO41
  scan: true
  frequency: 100kHz

pca9554:
  - id: relay_expander
    address: 0x20
    pin_count: 8

time:
  - platform: pcf85063
    id: board_rtc
    i2c_id: main_i2c
    address: 0x51
    update_interval: never
  - platform: sntp
    id: network_time
    timezone: Europe/Rome
    servers:
      - 0.it.pool.ntp.org
      - 1.it.pool.ntp.org
      - time.cloudflare.com
    update_interval: 6h
    on_time_sync:
      then:
        - pcf85063.write_time:
            id: board_rtc
        - lambda: |-
            auto now = id(network_time).now();
            id(last_ntp_sync_value) =
                now.is_valid() ? now.strftime("%d/%m/%Y %H:%M:%S") : "Ora non valida";
            id(event_log).log_event("OROLOGIO", "Ora sincronizzata tramite NTP e salvata nel RTC");

globals:
  - id: boot_count
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: boot_event_name
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: last_online_checkpoint
    type: int64_t
    restore_value: true
    initial_value: "0"
  - id: boot_offline_seconds
    type: int64_t
    restore_value: false
    initial_value: "-1"
  - id: ethernet_outage_started
    type: int64_t
    restore_value: false
    initial_value: "0"
  - id: last_outage_seconds
    type: int64_t
    restore_value: false
    initial_value: "-1"
  - id: public_ip_value
    type: std::string
    restore_value: false
    initial_value: '"non disponibile"'
  - id: network_report_event
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: network_report_intro
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: network_report_offline_seconds
    type: int
    restore_value: false
    initial_value: "-1"
  - id: network_report_message
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: internet_available
    type: bool
    restore_value: false
    initial_value: "false"
  - id: internet_probe_success
    type: bool
    restore_value: false
    initial_value: "false"
  - id: internet_retry_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: internet_status_value
    type: std::string
    restore_value: false
    initial_value: '"In attesa della rete"'
  - id: last_ntp_sync_value
    type: std::string
    restore_value: false
    initial_value: '"In attesa"'
  - id: telegram_update_offset
    type: int64_t
    restore_value: true
    initial_value: "0"
  - id: telegram_command_reply_pending
    type: bool
    restore_value: false
    initial_value: "false"
  - id: telegram_command_name
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: telegram_command_reply
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: telegram_command_status_value
    type: std::string
    restore_value: false
    initial_value: '"In attesa"'
  - id: remote_ha_event
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: remote_ha_message
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: remote_ha_1_status_value
    type: std::string
    restore_value: false
    initial_value: '"Disabilitato"'
  - id: remote_ha_2_status_value
    type: std::string
    restore_value: false
    initial_value: '"Disabilitato"'
  - id: startup_complete
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ethernet_ever_connected
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ethernet_lost
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ha_ever_connected
    type: bool
    restore_value: false
    initial_value: "false"
  - id: ha_connection_lost
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alarm_1_memory_value
    type: bool
    restore_value: true
    initial_value: "false"
  - id: alarm_2_memory_value
    type: bool
    restore_value: true
    initial_value: "false"
  - id: alarm_1_count_value
    type: int
    restore_value: true
    initial_value: "0"
  - id: alarm_2_count_value
    type: int
    restore_value: true
    initial_value: "0"
  - id: alarm_1_started
    type: int64_t
    restore_value: false
    initial_value: "0"
  - id: alarm_2_started
    type: int64_t
    restore_value: false
    initial_value: "0"
  - id: alarm_1_last_duration
    type: int
    restore_value: false
    initial_value: "0"
  - id: alarm_2_last_duration
    type: int
    restore_value: false
    initial_value: "0"
  - id: alarm_1_last_event_value
    type: std::string
    restore_value: true
    max_restore_data_length: 64
    initial_value: '"Mai"'
  - id: alarm_2_last_event_value
    type: std::string
    restore_value: true
    max_restore_data_length: 64
    initial_value: '"Mai"'

select:
  - platform: template
    id: alarm_1_logic
    name: "${central_1_name} - Logica contatto"
    icon: mdi:electric-switch
    options: ["NC", "NO"]
    initial_option: "NC"
    optimistic: true
    restore_value: true
    on_value:
      - if:
          condition:
            lambda: return id(startup_complete);
          then:
            - lambda: id(event_log).log_event("CONFIG", std::string("${central_1_name} impostata come ") + x);
  - platform: template
    id: alarm_2_logic
    name: "${central_2_name} - Logica contatto"
    icon: mdi:electric-switch
    options: ["NC", "NO"]
    initial_option: "NC"
    optimistic: true
    restore_value: true
    on_value:
      - if:
          condition:
            lambda: return id(startup_complete);
          then:
            - lambda: id(event_log).log_event("CONFIG", std::string("${central_2_name} impostata come ") + x);

switch:
  - platform: template
    id: alarm_1_excluded
    name: "${central_1_name} - Esclusione"
    icon: mdi:shield-off-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - if:
          condition:
            lambda: return id(startup_complete);
          then:
            - lambda: id(event_log).log_event("CONFIG", "${central_1_name} esclusa");
      - script.execute: update_status_led
    on_turn_off:
      - if:
          condition:
            lambda: return id(startup_complete);
          then:
            - lambda: id(event_log).log_event("CONFIG", "${central_1_name} riattivata");
      - script.execute: update_status_led
  - platform: template
    id: alarm_2_excluded
    name: "${central_2_name} - Esclusione"
    icon: mdi:shield-off-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - if:
          condition:
            lambda: return id(startup_complete);
          then:
            - lambda: id(event_log).log_event("CONFIG", "${central_2_name} esclusa");
      - script.execute: update_status_led
    on_turn_off:
      - if:
          condition:
            lambda: return id(startup_complete);
          then:
            - lambda: id(event_log).log_event("CONFIG", "${central_2_name} riattivata");
      - script.execute: update_status_led
  - platform: template
    id: buzzer_enabled
    name: "Buzzer abilitato"
    icon: mdi:volume-high
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: telegram_enabled
    name: "Notifiche Telegram abilitate"
    icon: mdi:send
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: brevo_enabled
    name: "Notifiche email Brevo abilitate"
    icon: mdi:email-fast-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: telegram_commands_enabled
    name: "Comandi Telegram abilitati"
    icon: mdi:message-text-lock-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: remote_ha_1_enabled
    name: "Invio Home Assistant remoto 1"
    icon: mdi:home-export-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: remote_ha_2_enabled
    name: "Invio Home Assistant remoto 2"
    icon: mdi:home-export-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Uscite fisiche mantenute interne e sempre spente in questo firmware.
  - platform: gpio
    id: relay_1_internal
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 0, mode: {output: true}}
  - platform: gpio
    id: relay_2_internal
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 1, mode: {output: true}}
  - platform: gpio
    id: relay_3_internal
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 2, mode: {output: true}}
  - platform: gpio
    id: relay_4_internal
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 3, mode: {output: true}}
  - platform: gpio
    id: relay_5_internal
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 4, mode: {output: true}}
  - platform: gpio
    id: relay_6_internal
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 5, mode: {output: true}}
  - platform: gpio
    id: relay_7_internal
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 6, mode: {output: true}}
  - platform: gpio
    id: relay_8_internal
    internal: true
    restore_mode: ALWAYS_OFF
    pin: {pca9554: relay_expander, number: 7, mode: {output: true}}

binary_sensor:
  # Lo stato fisico indica contatto CHIUSO, indipendentemente dalla logica NO/NC.
  - platform: gpio
    id: contact_1_closed
    name: "${central_1_name} - Contatto fisico"
    entity_category: diagnostic
    pin: {number: GPIO4, mode: {input: true, pullup: true}, inverted: true}
    filters: &contact_filters [{delayed_on: 50ms}, {delayed_off: 50ms}]
  - platform: gpio
    id: contact_2_closed
    name: "${central_2_name} - Contatto fisico"
    entity_category: diagnostic
    pin: {number: GPIO5, mode: {input: true, pullup: true}, inverted: true}
    filters: *contact_filters

  - platform: template
    id: alarm_1
    name: "${central_1_name} - Allarme"
    device_class: problem
    lambda: |-
      if (id(alarm_1_excluded).state) return false;
      const bool closed = id(contact_1_closed).state;
      return id(alarm_1_logic).current_option() == "NO" ? closed : !closed;
    filters:
      - delayed_on: 300ms
      - delayed_off: 1s
    on_press:
      - script.execute: alarm_1_activated
    on_release:
      - script.execute: alarm_1_restored
  - platform: template
    id: alarm_2
    name: "${central_2_name} - Allarme"
    device_class: problem
    lambda: |-
      if (id(alarm_2_excluded).state) return false;
      const bool closed = id(contact_2_closed).state;
      return id(alarm_2_logic).current_option() == "NO" ? closed : !closed;
    filters:
      - delayed_on: 300ms
      - delayed_off: 1s
    on_press:
      - script.execute: alarm_2_activated
    on_release:
      - script.execute: alarm_2_restored

  - platform: template
    id: alarm_1_memory
    name: "${central_1_name} - Memoria allarme"
    device_class: problem
    lambda: return id(alarm_1_memory_value);
  - platform: template
    id: alarm_2_memory
    name: "${central_2_name} - Memoria allarme"
    device_class: problem
    lambda: return id(alarm_2_memory_value);
  - platform: template
    id: any_alarm
    name: "Allarme generale"
    device_class: safety
    lambda: return id(alarm_1).state || id(alarm_2).state;
  - platform: template
    id: any_memory
    name: "Memoria allarme generale"
    device_class: problem
    lambda: return id(alarm_1_memory_value) || id(alarm_2_memory_value);
  - platform: template
    id: ha_connected
    name: "Home Assistant collegato"
    entity_category: diagnostic
    lambda: return id(native_api).is_connected();
    filters:
      - delayed_on: 5s
      - delayed_off: 30s
    on_press:
      - if:
          condition:
            lambda: return id(ha_connection_lost);
          then:
            - lambda: id(ha_connection_lost) = false;
            - lambda: id(event_log).log_event("HOME ASSISTANT", "Collegamento ripristinato");
            - if:
                condition:
                  switch.is_on: telegram_enabled
                then:
                  - script.execute:
                      id: telegram_send
                      event_name: "Home Assistant ripristinato"
                      telegram_text: "🟢 Collegamento Home Assistant ripristinato."
            - if:
                condition:
                  switch.is_on: brevo_enabled
                then:
                  - script.execute:
                      id: brevo_send
                      subject: "Home Assistant ripristinato"
                      message: "Il collegamento del concentratore a Home Assistant è stato ripristinato."
                      event_name: "Home Assistant ripristinato"
      - lambda: id(ha_ever_connected) = true;
    on_release:
      - if:
          condition:
            lambda: return id(ha_ever_connected);
          then:
            - lambda: id(ha_connection_lost) = true;
            - lambda: id(event_log).log_event("HOME ASSISTANT", "Collegamento assente da almeno 30 secondi");
            - if:
                condition:
                  switch.is_on: telegram_enabled
                then:
                  - script.execute:
                      id: telegram_send
                      event_name: "Home Assistant scollegato"
                      telegram_text: "🟠 Collegamento Home Assistant assente da almeno 30 secondi."
            - if:
                condition:
                  switch.is_on: brevo_enabled
                then:
                  - script.execute:
                      id: brevo_send
                      subject: "Home Assistant scollegato"
                      message: "Il collegamento del concentratore a Home Assistant è assente da almeno 30 secondi."
                      event_name: "Home Assistant scollegato"

  # Sei contatti pronti per espansioni successive.
  - platform: gpio
    name: "Ingresso riserva 3"
    disabled_by_default: true
    pin: {number: GPIO6, mode: {input: true, pullup: true}, inverted: true}
    filters: *contact_filters
  - platform: gpio
    name: "Ingresso riserva 4"
    disabled_by_default: true
    pin: {number: GPIO7, mode: {input: true, pullup: true}, inverted: true}
    filters: *contact_filters
  - platform: gpio
    name: "Ingresso riserva 5"
    disabled_by_default: true
    pin: {number: GPIO8, mode: {input: true, pullup: true}, inverted: true}
    filters: *contact_filters
  - platform: gpio
    name: "Ingresso riserva 6"
    disabled_by_default: true
    pin: {number: GPIO9, mode: {input: true, pullup: true}, inverted: true}
    filters: *contact_filters
  - platform: gpio
    name: "Ingresso riserva 7"
    disabled_by_default: true
    pin: {number: GPIO10, mode: {input: true, pullup: true}, inverted: true}
    filters: *contact_filters
  - platform: gpio
    name: "Ingresso riserva 8"
    disabled_by_default: true
    pin: {number: GPIO11, mode: {input: true, pullup: true}, inverted: true}
    filters: *contact_filters

output:
  - platform: ledc
    id: buzzer_output
    pin: GPIO46
    frequency: 2000Hz

rtttl:
  id: board_buzzer
  output: buzzer_output
  gain: 60%

light:
  - platform: esp32_rmt_led_strip
    id: status_rgb
    name: "LED di stato"
    pin: GPIO38
    num_leds: 1
    rgb_order: RGB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "Allarme"
          transition_length: 250ms
          update_interval: 250ms

sensor:
  - platform: template
    id: alarm_1_count
    name: "${central_1_name} - Numero allarmi"
    icon: mdi:counter
    accuracy_decimals: 0
    lambda: return id(alarm_1_count_value);
    update_interval: 5s
  - platform: template
    id: alarm_2_count
    name: "${central_2_name} - Numero allarmi"
    icon: mdi:counter
    accuracy_decimals: 0
    lambda: return id(alarm_2_count_value);
    update_interval: 5s
  - platform: template
    id: alarm_1_duration
    name: "${central_1_name} - Durata allarme"
    device_class: duration
    unit_of_measurement: s
    accuracy_decimals: 0
    lambda: |-
      if (id(alarm_1).state && id(alarm_1_started) > 0) {
        return id(board_rtc).now().timestamp - id(alarm_1_started);
      }
      return id(alarm_1_last_duration);
    update_interval: 1s
  - platform: template
    id: alarm_2_duration
    name: "${central_2_name} - Durata allarme"
    device_class: duration
    unit_of_measurement: s
    accuracy_decimals: 0
    lambda: |-
      if (id(alarm_2).state && id(alarm_2_started) > 0) {
        return id(board_rtc).now().timestamp - id(alarm_2_started);
      }
      return id(alarm_2_last_duration);
    update_interval: 1s
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 30s
  - platform: internal_temperature
    name: "Temperatura ESP32"
    entity_category: diagnostic
    update_interval: 30s

text_sensor:
  - platform: template
    name: "${central_1_name} - Stato"
