    update_interval: 1s
  - platform: template
    name: "${central_2_name} - Stato"
    icon: mdi:shield-alert-outline
    lambda: |-
      if (id(alarm_2_excluded).state) return {"Escluso"};
      if (id(alarm_2).state) return {"Allarme"};
      if (id(alarm_2_memory_value)) return {"Ripristinato - memoria presente"};
      return {"Normale"};
    update_interval: 1s
  - platform: template
    name: "${central_1_name} - Ultima attivazione"
    icon: mdi:clock-alert-outline
    lambda: return id(alarm_1_last_event_value);
    update_interval: 5s
  - platform: template
    name: "${central_2_name} - Ultima attivazione"
    icon: mdi:clock-alert-outline
    lambda: return id(alarm_2_last_event_value);
    update_interval: 5s
  - platform: template
    id: telegram_status
    name: "Ultimo invio Telegram"
    entity_category: diagnostic
    lambda: return {"Nessun invio"};
    update_interval: never
  - platform: template
    id: brevo_status
    name: "Ultimo invio email Brevo"
    entity_category: diagnostic
    lambda: return {"Nessun invio"};
    update_interval: never
  - platform: template
    name: "Ultima sincronizzazione NTP"
    icon: mdi:clock-check-outline
    entity_category: diagnostic
    lambda: return id(last_ntp_sync_value);
    update_interval: 30s
  - platform: template
    name: "Stato connessione Internet"
    icon: mdi:web-check
    entity_category: diagnostic
    lambda: return id(internet_status_value);
    update_interval: 10s
  - platform: template
    name: "Ultimo comando Telegram"
    icon: mdi:message-processing-outline
    entity_category: diagnostic
    lambda: return id(telegram_command_status_value);
    update_interval: 10s
  - platform: template
    name: "Ultimo invio Home Assistant remoto 1"
    icon: mdi:cloud-check-outline
    entity_category: diagnostic
    lambda: return id(remote_ha_1_status_value);
    update_interval: 10s
  - platform: template
    name: "Ultimo invio Home Assistant remoto 2"
    icon: mdi:cloud-check-outline
    entity_category: diagnostic
    lambda: return id(remote_ha_2_status_value);
    update_interval: 10s
  - platform: ethernet_info
    ip_address:
      id: ethernet_ip
      name: "Indirizzo IP Ethernet"
      entity_category: diagnostic
    mac_address:
      name: "MAC Ethernet"
      entity_category: diagnostic
  - platform: version
    name: "Versione ESPHome"
    entity_category: diagnostic

button:
  - platform: template
    name: "Tacita buzzer"
    icon: mdi:volume-off
    on_press:
      - rtttl.stop:
      - lambda: id(event_log).log_event("COMANDO", "Buzzer tacitato");
  - platform: template
    name: "Cancella tutte le memorie"
    icon: mdi:notification-clear-all
    on_press:
      - if:
          condition:
            lambda: return !id(alarm_1).state && !id(alarm_2).state;
          then:
            - lambda: |-
                id(alarm_1_memory_value) = false;
                id(alarm_2_memory_value) = false;
                id(event_log).log_event("COMANDO", "Memorie allarme cancellate");
            - script.execute: update_status_led
          else:
            - logger.log:
                level: WARN
                format: "Memoria non cancellata: almeno un allarme è ancora attivo"
            - lambda: |-
                id(event_log).log_event("COMANDO", "Cancellazione memorie rifiutata: allarme attivo");
  - platform: template
    name: "Test Telegram diretto"
    icon: mdi:send-check
    on_press:
      - script.execute: telegram_test
  - platform: template
    name: "Test email Brevo"
    icon: mdi:email-check-outline
    on_press:
      - script.execute:
          id: brevo_send
          subject: "Test Alarm Contact Collector"
          message: "Test email Brevo ricevuto correttamente."
          event_name: "Test"
  - platform: restart
    name: "Riavvia concentratore"
    entity_category: diagnostic
  - platform: safe_mode
    name: "Riavvia in modalità sicura"
    entity_category: diagnostic

interval:
  - interval: 5s
    then:
      - script.execute: update_status_led
  - interval: 5min
    then:
      - if:
          condition:
            lambda: return id(ethernet_ever_connected) && !id(ethernet_lost);
          then:
            - lambda: |-
                auto now = id(board_rtc).now();
                if (now.is_valid()) id(last_online_checkpoint) = now.timestamp;
  - interval: 10s
    then:
      - if:
          condition:
            and:
              - switch.is_on: telegram_commands_enabled
              - lambda: return id(ethernet_ever_connected) && !id(ethernet_lost);
          then:
            - script.execute: telegram_poll

script:
  - id: remote_ha_send
    mode: queued
    max_runs: 8
    parameters:
      event_name: string
      event_message: string
    then:
      - lambda: |-
          id(remote_ha_event) = event_name;
          id(remote_ha_message) = event_message;
      - if:
          condition:
            switch.is_on: remote_ha_1_enabled
          then:
            - http_request.post:
                url: !secret ha_remote_1_webhook_url
                capture_response: true
                max_response_buffer_size: 256
                request_headers:
                  Content-Type: "application/json"
                json: &remote_ha_payload |-
                  auto now = id(board_rtc).now();
                  root["device"] = "${device_name}";
                  root["event"] = id(remote_ha_event);
                  root["message"] = id(remote_ha_message);
                  root["timestamp"] = now.is_valid() ? now.strftime("%Y-%m-%dT%H:%M:%S%z") : "";
                  root["alarm_1"] = id(alarm_1).state;
                  root["alarm_2"] = id(alarm_2).state;
                  root["memory_1"] = id(alarm_1_memory_value);
                  root["memory_2"] = id(alarm_2_memory_value);
                  root["local_ip"] = id(ethernet_ip).state;
                  root["public_ip"] = id(public_ip_value);
                on_response:
                  then:
                    - lambda: |-
                        id(remote_ha_1_status_value) =
                            id(remote_ha_event) + ": HTTP " + std::to_string(response->status_code);
                        id(event_log).log_event("HA REMOTO 1", id(remote_ha_1_status_value));
                on_error:
                  then:
                    - lambda: |-
                        id(remote_ha_1_status_value) = "Errore invio - " + id(remote_ha_event);
                        id(event_log).log_event("HA REMOTO 1", id(remote_ha_1_status_value));
      - if:
          condition:
            switch.is_on: remote_ha_2_enabled
          then:
            - http_request.post:
                url: !secret ha_remote_2_webhook_url
                capture_response: true
                max_response_buffer_size: 256
                request_headers:
                  Content-Type: "application/json"
                json: *remote_ha_payload
                on_response:
                  then:
                    - lambda: |-
                        id(remote_ha_2_status_value) =
                            id(remote_ha_event) + ": HTTP " + std::to_string(response->status_code);
                        id(event_log).log_event("HA REMOTO 2", id(remote_ha_2_status_value));
                on_error:
                  then:
                    - lambda: |-
                        id(remote_ha_2_status_value) = "Errore invio - " + id(remote_ha_event);
                        id(event_log).log_event("HA REMOTO 2", id(remote_ha_2_status_value));

  - id: telegram_poll
    mode: single
    then:
      - lambda: id(telegram_command_reply_pending) = false;
      - http_request.get:
          url: !lambda |-
            return std::string("${telegram_updates_url}?offset=") +
                   std::to_string(id(telegram_update_offset)) + "&limit=1&timeout=0";
          capture_response: true
          max_response_buffer_size: 2048
          request_headers:
            accept: "application/json"
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {
                          JsonArray results = root["result"].as<JsonArray>();
                          if (results.isNull() || results.size() == 0) return true;

                          JsonObject update = results[0].as<JsonObject>();
                          int64_t update_id = update["update_id"].as<int64_t>();
                          if (update_id >= id(telegram_update_offset)) {
                            id(telegram_update_offset) = update_id + 1;
                          }

                          JsonObject message = update["message"].as<JsonObject>();
                          if (message.isNull() || !message["text"].is<const char *>()) return true;

                          int64_t numeric_chat_id = message["chat"]["id"].as<int64_t>();
                          std::string chat_id = std::to_string(numeric_chat_id);
                          std::string text = message["text"].as<std::string>();
                          if (chat_id != "${telegram_authorized_chat_id}") {
                            id(telegram_command_status_value) = "Rifiutato da chat " + chat_id;
                            id(event_log).log_event("TELEGRAM CMD", "Comando rifiutato da chat " + chat_id);
                            return true;
                          }

                          size_t space = text.find(' ');
                          std::string command = text.substr(0, space);
                          size_t at = command.find('@');
                          if (at != std::string::npos) command.resize(at);
                          for (auto &character : command) {
                            if (character >= 'A' && character <= 'Z') character += 'a' - 'A';
                          }

                          std::string reply;
                          if (command == "/stato") {
                            uint32_t uptime = millis() / 1000;
                            char value[320];
                            snprintf(value, sizeof(value),
                                     "📟 STATO CONCENTRATORE\nCentrale 1: %s\nCentrale 2: %s\nMemoria 1: %s\nMemoria 2: %s\nHome Assistant: %s\nUptime: %lu s",
                                     id(alarm_1).state ? "ALLARME" : "normale",
                                     id(alarm_2).state ? "ALLARME" : "normale",
                                     id(alarm_1_memory_value) ? "presente" : "vuota",
                                     id(alarm_2_memory_value) ? "presente" : "vuota",
                                     id(native_api).is_connected() ? "collegato" : "scollegato",
                                     static_cast<unsigned long>(uptime));
                            reply = value;
                          } else if (command == "/allarmi") {
                            char value[320];
                            snprintf(value, sizeof(value),
                                     "🚨 ALLARMI\nCentrale 1: %s - conteggio %d\nUltimo evento 1: %s\nCentrale 2: %s - conteggio %d\nUltimo evento 2: %s",
                                     id(alarm_1).state ? "ATTIVO" : "normale",
                                     id(alarm_1_count_value), id(alarm_1_last_event_value).c_str(),
                                     id(alarm_2).state ? "ATTIVO" : "normale",
                                     id(alarm_2_count_value), id(alarm_2_last_event_value).c_str());
                            reply = value;
                          } else if (command == "/rete") {
                            std::string local_ip = id(ethernet_ip).state;
                            if (local_ip.empty()) local_ip = "non disponibile";
                            reply = "🌐 RETE\nIP locale: " + local_ip +
                                    "\nIP pubblico: " + id(public_ip_value) +
                                    "\nHome Assistant: " +
                                    (id(native_api).is_connected() ? "collegato" : "scollegato") +
                                    "\nUltimo NTP: " + id(last_ntp_sync_value);
                          } else if (command == "/storico") {
                            std::string local_ip = id(ethernet_ip).state;
                            reply = "📚 STORICO EVENTI\nPagina: http://" + local_ip +
                                    "/history\nCSV: http://" + local_ip + "/history.csv" +
                                    "\nJSON: http://" + local_ip + "/history.json";
                          } else if (command == "/help" || command == "/start") {
                            reply = "🤖 COMANDI DISPONIBILI\n/stato - riepilogo generale\n/allarmi - ingressi e memorie\n/rete - IP e collegamenti\n/storico - collegamenti al registro\n/help - questo elenco";
                          } else if (!command.empty() && command[0] == '/') {
                            reply = "Comando non riconosciuto. Usa /help.";
                          } else {
                            return true;
                          }

                          id(telegram_command_name) = command;
                          id(telegram_command_reply) = reply;
                          id(telegram_command_reply_pending) = true;
                          id(telegram_command_status_value) = "Eseguito " + command;
                          id(event_log).log_event("TELEGRAM CMD", "Eseguito " + command);
                          return true;
                        });
                    - if:
                        condition:
                          lambda: return id(telegram_command_reply_pending);
                        then:
                          - script.execute:
                              id: telegram_send
                              event_name: !lambda return std::string("Comando ") + id(telegram_command_name);
                              telegram_text: !lambda return id(telegram_command_reply);
                  else:
                    - lambda: |-
                        id(telegram_command_status_value) =
                            "Polling HTTP " + std::to_string(response->status_code);
          on_error:
            then:
              - lambda: id(telegram_command_status_value) = "Errore polling Telegram";

  - id: network_report
    mode: restart
    parameters:
      event_name: string
      intro: string
      offline_seconds: int
    then:
      - lambda: |-
          id(network_report_event) = event_name;
          id(network_report_intro) = intro;
          id(network_report_offline_seconds) = offline_seconds;
          id(public_ip_value) = "non disponibile";
          id(internet_available) = false;
          id(internet_retry_count) = 0;
          id(internet_status_value) = "Verifica connessione Internet";
      - script.execute: network_report_probe

  - id: network_report_probe
    mode: restart
    then:
      - lambda: id(internet_probe_success) = false;
      - http_request.get:
          url: "https://api.ipify.org"
          capture_response: true
          max_response_buffer_size: 64
          on_response:
            then:
              - lambda: |-
                  std::string value = body;
                  while (!value.empty() &&
                         (value.back() == ' ' || value.back() == '\n' ||
                          value.back() == '\r' || value.back() == '\t')) {
                    value.pop_back();
                  }
                  size_t first = 0;
                  while (first < value.size() &&
                         (value[first] == ' ' || value[first] == '\n' ||
                          value[first] == '\r' || value[first] == '\t')) {
                    first++;
                  }
                  if (first > 0) value.erase(0, first);
                  if (response->status_code == 200 && !value.empty() && value.size() < 64) {
                    id(public_ip_value) = value;
                    id(internet_probe_success) = true;
                    id(internet_available) = true;
                    id(internet_retry_count) = 0;
                    id(internet_status_value) = "Internet disponibile - IP " + value;
                  }
              - if:
                  condition:
                    lambda: return id(internet_probe_success);
                  then:
                    - lambda: id(event_log).log_event("RETE", "Internet disponibile");
                    - script.execute: network_report_send
                  else:
                    - script.execute: network_report_retry
          on_error:
            then:
              - script.execute: network_report_retry

  - id: network_report_retry
    mode: restart
    then:
      - lambda: |-
          id(internet_available) = false;
          id(internet_retry_count) += 1;
          id(internet_status_value) =
              "Internet non disponibile - tentativo " +
              std::to_string(id(internet_retry_count)) + " - nuovo tentativo tra 30 s";
          if (id(internet_retry_count) == 1 || id(internet_retry_count) % 10 == 0) {
            id(event_log).log_event(
                "RETE",
                "Internet non disponibile, tentativo " +
                std::to_string(id(internet_retry_count)));
          }
      - delay: 30s
      - script.execute: network_report_probe

  - id: network_report_send
    mode: restart
    then:
      - lambda: |-
          auto format_duration = [](int seconds) -> std::string {
            if (seconds < 0) return "non disponibile";
            if (seconds < 60) return "meno di 1 minuto";
            int days = seconds / 86400;
            int hours = (seconds % 86400) / 3600;
            int minutes = (seconds % 3600) / 60;
            int secs = seconds % 60;
            char value[96];
            if (days > 0) {
              snprintf(value, sizeof(value), "%d g %d h %d min %d s", days, hours, minutes, secs);
            } else if (hours > 0) {
              snprintf(value, sizeof(value), "%d h %d min %d s", hours, minutes, secs);
            } else {
              snprintf(value, sizeof(value), "%d min %d s", minutes, secs);
            }
            return value;
          };
          std::string local_ip = id(ethernet_ip).state;
          if (local_ip.empty()) local_ip = "non disponibile";
          std::string offline = format_duration(id(network_report_offline_seconds));
          id(network_report_message) =
              id(network_report_intro) +
              "\nIP locale: " + local_ip +
              "\nIP pubblico: " + id(public_ip_value) +
              "\nTempo offline: " + offline;
          id(event_log).log_event(
              "RETE",
              id(network_report_event) + " - IP locale " + local_ip +
              ", IP pubblico " + id(public_ip_value) +
              ", offline " + offline);
      - script.execute:
          id: remote_ha_send
          event_name: !lambda return id(network_report_event);
          event_message: !lambda return id(network_report_message);
      - if:
          condition:
            switch.is_on: telegram_enabled
          then:
            - script.execute:
                id: telegram_send
                event_name: !lambda return id(network_report_event);
                telegram_text: !lambda return id(network_report_message);
      - if:
          condition:
            switch.is_on: brevo_enabled
          then:
            - script.execute:
                id: brevo_send
                subject: !lambda return std::string("Alarm Contact Collector - ") + id(network_report_event);
                message: !lambda return id(network_report_message);
                event_name: !lambda return id(network_report_event);

  - id: alarm_1_activated
    mode: restart
    then:
      - lambda: |-
          auto now = id(board_rtc).now();
          id(alarm_1_memory_value) = true;
          id(alarm_1_count_value) += 1;
          id(alarm_1_started) = now.is_valid() ? now.timestamp : 0;
          id(alarm_1_last_event_value) =
            now.is_valid() ? now.strftime("%d/%m/%Y %H:%M:%S") : "Ora non disponibile";
      - component.update: alarm_1_count
      - lambda: id(event_log).log_event("ALLARME", "${central_1_name} attivata");
      - script.execute:
          id: remote_ha_send
          event_name: "alarm_1_activated"
          event_message: "Allarme attivo su ${central_1_name}"
      - script.execute: update_status_led
      - if:
          condition:
            switch.is_on: buzzer_enabled
          then:
            - rtttl.play: "alarm:d=8,o=6,b=180:c7,p,c7,p,c7,p,c7"
      - if:
          condition:
            switch.is_on: telegram_enabled
          then:
            - script.execute:
                id: telegram_send
                event_name: "Allarme 1"
                telegram_text: "🚨 ALLARME - ${central_1_name}"
      - if:
          condition:
            switch.is_on: brevo_enabled
          then:
            - script.execute:
                id: brevo_send
                subject: "ALLARME - ${central_1_name}"
                message: "Allarme attivo su ${central_1_name}."
                event_name: "Allarme 1"
  - id: alarm_2_activated
    mode: restart
    then:
      - lambda: |-
          auto now = id(board_rtc).now();
          id(alarm_2_memory_value) = true;
          id(alarm_2_count_value) += 1;
          id(alarm_2_started) = now.is_valid() ? now.timestamp : 0;
          id(alarm_2_last_event_value) =
            now.is_valid() ? now.strftime("%d/%m/%Y %H:%M:%S") : "Ora non disponibile";
      - component.update: alarm_2_count
      - lambda: id(event_log).log_event("ALLARME", "${central_2_name} attivata");
      - script.execute:
          id: remote_ha_send
          event_name: "alarm_2_activated"
          event_message: "Allarme attivo su ${central_2_name}"
      - script.execute: update_status_led
      - if:
          condition:
            switch.is_on: buzzer_enabled
          then:
            - rtttl.play: "alarm:d=8,o=6,b=180:c7,p,c7,p,c7,p,c7"
      - if:
          condition:
            switch.is_on: telegram_enabled
          then:
            - script.execute:
                id: telegram_send
                event_name: "Allarme 2"
                telegram_text: "🚨 ALLARME - ${central_2_name}"
      - if:
          condition:
            switch.is_on: brevo_enabled
          then:
            - script.execute:
                id: brevo_send
                subject: "ALLARME - ${central_2_name}"
                message: "Allarme attivo su ${central_2_name}."
                event_name: "Allarme 2"
  - id: alarm_1_restored
    mode: restart
    then:
      - lambda: |-
          auto now = id(board_rtc).now();
          if (id(alarm_1_started) > 0 && now.is_valid()) {
            id(alarm_1_last_duration) = now.timestamp - id(alarm_1_started);
          }
          id(alarm_1_started) = 0;
      - lambda: id(event_log).log_event("RIPRISTINO", "${central_1_name} ripristinata");
      - script.execute:
          id: remote_ha_send
          event_name: "alarm_1_restored"
          event_message: "Allarme ripristinato su ${central_1_name}"
      - script.execute: update_status_led
      - if:
          condition:
            switch.is_on: telegram_enabled
          then:
            - script.execute:
                id: telegram_send
                event_name: "Ripristino 1"
                telegram_text: "✅ RIPRISTINO - ${central_1_name}"
      - if:
          condition:
            switch.is_on: brevo_enabled
          then:
            - script.execute:
                id: brevo_send
                subject: "RIPRISTINO - ${central_1_name}"
                message: "Allarme ripristinato su ${central_1_name}."
                event_name: "Ripristino 1"
  - id: alarm_2_restored
    mode: restart
    then:
      - lambda: |-
          auto now = id(board_rtc).now();
          if (id(alarm_2_started) > 0 && now.is_valid()) {
            id(alarm_2_last_duration) = now.timestamp - id(alarm_2_started);
          }
          id(alarm_2_started) = 0;
      - lambda: id(event_log).log_event("RIPRISTINO", "${central_2_name} ripristinata");
      - script.execute:
          id: remote_ha_send
          event_name: "alarm_2_restored"
          event_message: "Allarme ripristinato su ${central_2_name}"
      - script.execute: update_status_led
      - if:
          condition:
            switch.is_on: telegram_enabled
          then:
            - script.execute:
                id: telegram_send
                event_name: "Ripristino 2"
                telegram_text: "✅ RIPRISTINO - ${central_2_name}"
      - if:
          condition:
            switch.is_on: brevo_enabled
          then:
            - script.execute:
                id: brevo_send
                subject: "RIPRISTINO - ${central_2_name}"
                message: "Allarme ripristinato su ${central_2_name}."
                event_name: "Ripristino 2"

  - id: update_status_led
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_on: any_alarm
          then:
            - light.turn_on:
                id: status_rgb
                brightness: 50%
                red: 100%
                green: 0%
                blue: 0%
                effect: "Allarme"
          else:
            - if:
                condition:
                  binary_sensor.is_on: any_memory
                then:
                  - light.turn_on:
                      id: status_rgb
                      brightness: 35%
                      red: 100%
                      green: 45%
                      blue: 0%
                      effect: none
                else:
                  - if:
                      condition:
                        or:
                          - switch.is_on: alarm_1_excluded
                          - switch.is_on: alarm_2_excluded
                      then:
                        - light.turn_on:
                            id: status_rgb
                            brightness: 35%
                            red: 65%
                            green: 0%
                            blue: 100%
                            effect: none
                      else:
                        - if:
                            condition:
                              not:
                                api.connected:
                                  state_subscription_only: true
                            then:
                              - light.turn_on:
                                  id: status_rgb
                                  brightness: 25%
                                  red: 0%
                                  green: 20%
                                  blue: 100%
                                  effect: none
                            else:
                              - light.turn_on:
                                  id: status_rgb
                                  brightness: 25%
                                  red: 0%
                                  green: 100%
                                  blue: 0%
                                  effect: none

  - id: telegram_send
    mode: queued
    max_runs: 8
    parameters:
      event_name: string
      telegram_text: string
    then:
      - http_request.post:
          url: !secret telegram_send_url
          capture_response: true
          max_response_buffer_size: 512
          request_headers:
            accept: "application/json"
            Content-Type: "application/json"
          json:
            chat_id: !secret telegram_chat_id
            text: !lambda return telegram_text;
          on_response:
            then:
              - lambda: |-
                  std::string detail = body;
                  if (detail.length() > 180) detail.resize(180);
                  char status[256];
                  snprintf(status, sizeof(status), "%s: HTTP %d - %s",
                           event_name.c_str(), response->status_code, detail.c_str());
                  id(telegram_status).publish_state(status);
                  ESP_LOGI("telegram", "%s", status);
                  id(event_log).log_event("TELEGRAM", status);
          on_error:
            then:
              - lambda: |-
                  std::string status = std::string("Errore connessione - ") + event_name;
                  id(telegram_status).publish_state(status);
                  id(event_log).log_event("TELEGRAM", status);
  - id: telegram_test
    mode: restart
    then:
      - script.execute:
          id: telegram_send
          event_name: "Test"
          telegram_text: "✅ Test Alarm Contact Collector ricevuto correttamente."

  - id: brevo_send
    mode: queued
    max_runs: 5
    parameters:
      subject: string
      message: string
      event_name: string
    then:
      - http_request.post:
          url: "https://api.brevo.com/v3/smtp/email"
          request_headers:
            accept: "application/json"
            api-key: !secret brevo_api_key
            Content-Type: "application/json"
          json: |-
            root["sender"]["name"] = "${brevo_sender_name}";
            root["sender"]["email"] = "${brevo_sender_email}";
            root["to"][0]["name"] = "${brevo_recipient_name}";
            root["to"][0]["email"] = "${brevo_recipient_email}";
            root["subject"] = subject;
            root["textContent"] = message;
          on_response:
            then:
              - lambda: |-
                  char result[96];
                  snprintf(result, sizeof(result), "%s: HTTP %d",
                           event_name.c_str(), response->status_code);
                  id(brevo_status).publish_state(result);
                  id(event_log).log_event("EMAIL", result);
          on_error:
            then:
              - lambda: |-
                  std::string result = std::string("Errore invio - ") + event_name;
                  id(brevo_status).publish_state(result);
                  id(event_log).log_event("EMAIL", result);
